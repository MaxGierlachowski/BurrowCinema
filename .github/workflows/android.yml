name: Android APK

# Builds the Expo app into an installable APK without an Expo account.
# Every change to app/ or shared/ on main produces an APK artifact.
# A release with the APK attached is published either by pushing a tag (for example 001)
# or by starting this workflow by hand under Actions and entering a release name.

on:
  push:
    branches: [main]
    paths: [app/**, shared/**, .github/workflows/android.yml]
    tags: ['[0-9]*']
  workflow_dispatch:
    inputs:
      release:
        description: Release name and tag, for example 002. Leave empty to only build the APK.
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx expo prebuild --platform android --no-install

      - name: Build release APK
        working-directory: app/android
        # Phones are arm64, but many TV boxes still run a 32 bit system, so armeabi-v7a is built too.
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a --no-daemon

      - name: Check APK
        # One APK for phones and Android TV: both ABIs and the TV launcher entry must be present.
        run: |
          apk=android/app/build/outputs/apk/release/app-release.apk
          aapt=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)aapt
          "$aapt" dump badging "$apk" > "$RUNNER_TEMP/badging.txt"
          grep -E "native-code|launchable-activity|uses-feature" "$RUNNER_TEMP/badging.txt"
          for needle in "'arm64-v8a'" "'armeabi-v7a'" "leanback-launchable-activity"; do
            grep -q "$needle" "$RUNNER_TEMP/badging.txt" || { echo "::error::APK is missing $needle"; exit 1; }
          done
          echo "APK size: $(du -h "$apk" | cut -f1)"

      - name: Name the APK
        run: |
          version=${{ inputs.release || (github.ref_type == 'tag' && github.ref_name) || format('main-{0}', github.run_number) }}
          cp android/app/build/outputs/apk/release/app-release.apk "../BurrowCinema-$version.apk"
          ls -lh ../BurrowCinema-*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: BurrowCinema-apk
          path: BurrowCinema-*.apk

      - name: Publish release
        if: github.ref_type == 'tag' || inputs.release != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: BurrowCinema ${{ inputs.release || github.ref_name }}
          files: BurrowCinema-*.apk
          body: |
            Android App zum direkten Installieren.

            1. `BurrowCinema-${{ inputs.release || github.ref_name }}.apk` unten herunterladen und auf dem Handy öffnen.
            2. Falls nachgefragt, die Installation aus dieser Quelle erlauben.
            3. In der App mit dem Jellyfin Account anmelden. Radarr, Sonarr und der Auslosung Server kommen automatisch aus dem Jellyfin Profil.

            Läuft auf Handys und Android TV (64 und 32 Bit ARM).

            Auf dem TV: APK mit einer Downloader App oder per `adb install` installieren. BurrowCinema erscheint im TV Launcher. Anmeldung per Quick Connect: Code am TV anzeigen und in Jellyfin (Web, Quick Connect) oder in BurrowCinema auf dem Handy unter Einstellungen, TV verbinden, bestätigen.
